<title>CorreiaCOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Paleta tirada das tintas do logótipo: o vermelho e o azul da roda são as
     cores de trabalho do site, para a marca e as páginas falarem a mesma língua. */
  :root {
    --paper: #f6f3ec;
    --paper-2: #ece7db;
    --card: #ffffff;
    --ink: #14120f;
    --body: #4a463e;
    --muted: #857f74;
    --line: #d9d3c6;
    --line-soft: #e8e2d6;
    --red: #ed1c24;
    --red-dark: #c2141b;
    --blue: #2e3192;
    --cyan: #00aeef;
    --green: #00a651;
    --amber: #fdb913;
    --magenta: #ec008c;
    --gutter: clamp(16px, 4vw, 56px);
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--body);
    font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  h1, h2, h3, h4 {
    margin: 0;
    color: var(--ink);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.02;
    text-wrap: balance;
  }
  p { margin: 0; text-wrap: pretty; }
  img { max-width: 100%; }
  a { color: var(--red); text-decoration: none; }
  a:hover { color: var(--red-dark); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  .wrap { padding-inline: var(--gutter); }

  /* Etiquetas técnicas: monoespaçada, como as anotações numa ficha de obra. */
  .cap {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 700; color: var(--muted);
  }
  .mono { font-family: "Space Mono", ui-monospace, monospace; }

  /* Barra de controlo de cor — a tira que sai na margem de cada folha impressa. */
  .colorbar { display: flex; height: 7px; width: 100%; }
  .colorbar span { flex: 1; }
  .colorbar.thin { height: 4px; }

  /* Marcas de corte nos cantos, como numa prova de impressão. */
  .crop { position: relative; }
  .crop::before, .crop::after {
    content: ""; position: absolute; width: 13px; height: 13px; pointer-events: none;
    border-color: var(--line); border-style: solid;
  }
  .crop::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .crop::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  /* Trama de meio-tom, em vez de textura de papel. */
  .halftone { position: relative; }
  .halftone::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .42;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 9px 9px;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; padding: 12px 26px; border-radius: 3px;
    font-size: 14.5px; font-weight: 700; letter-spacing: 0.01em; text-align: center;
    transition: background-color .14s ease, color .14s ease, border-color .14s ease;
  }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { background: var(--red-dark); color: #fff; }
  .btn-ink { background: var(--ink); color: var(--paper); }
  .btn-ink:hover { background: #302b23; color: var(--paper); }
  .btn-ghost { border: 1.5px solid var(--ink); color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .btn-ochre { background: var(--amber); color: var(--ink); }
  .btn-ochre:hover { background: #e5a40c; color: var(--ink); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 3px; }
  .note {
    background: #fff6d9; border-left: 4px solid var(--amber); border-radius: 2px;
    padding: 15px 20px; font-size: 14px; line-height: 1.65; color: #5c4a14;
  }
  .note strong { color: #3d3008; }

  /* Ficha de trabalho: linhas rotuladas, como uma ordem de serviço. */
  .ticket { border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .ticket-head {
    background: var(--ink); color: var(--paper); padding: 11px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-family: "Space Mono", monospace; font-size: 11.5px;
    letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
  }
  .ticket-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 12px 16px; border-bottom: 1px dashed var(--line); font-size: 15px;
  }
  .ticket-row:last-child { border-bottom: 0; }
  .ticket-row dt {
    font-family: "Space Mono", monospace; font-size: 11.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin: 0; white-space: nowrap;
  }
  .ticket-row dd { margin: 0; font-weight: 600; color: var(--ink); text-align: right; }

  .topbar {
    background: var(--ink); color: #cfc9bc;
    display: flex; align-items: center; justify-content: center;
    gap: 20px; flex-wrap: wrap; padding: 9px var(--gutter);
    font-family: "Space Mono", monospace; font-size: 11.5px;
    letter-spacing: 0.04em; text-align: center;
  }
  .topbar a { color: #cfc9bc; }
  .topbar a:hover { color: #fff; }
  .topbar .sep { opacity: .4; }

  header.site {
    position: sticky; top: 0; z-index: 40;
    background: rgba(246,243,236,.96);
    backdrop-filter: blur(8px);
    border-bottom: 1.5px solid var(--ink);
  }
  .navrow { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 12px; }
  .brand { display: inline-flex; align-items: center; gap: 11px; }
  .wm {
    font-family: Archivo, sans-serif; font-weight: 800; font-size: 25px;
    color: var(--ink); letter-spacing: -0.04em; white-space: nowrap;
  }
  nav.main { display: flex; align-items: center; gap: 24px; }
  nav.main a {
    color: var(--body); font-size: 13.5px; font-weight: 600;
    letter-spacing: 0.02em; text-transform: uppercase; padding-block: 4px;
  }
  nav.main a:hover { color: var(--ink); }
  nav.main a.on { color: var(--ink); box-shadow: inset 0 -3px 0 var(--red); }
  .navactions { display: flex; align-items: center; gap: 10px; }
  .cartbtn {
    display: inline-flex; align-items: center; gap: 9px; min-height: 44px;
    padding: 8px 12px; font-size: 13.5px; font-weight: 600; color: var(--body);
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .cartbtn:hover { color: var(--ink); }
  .badge {
    background: var(--red); color: #fff; border-radius: 2px; min-width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "Space Mono", monospace; font-size: 11px; font-weight: 700; padding-inline: 5px;
  }
  .burger { display: none; width: 46px; height: 46px; border: 1.5px solid var(--ink); align-items: center; justify-content: center; }

  footer.site { background: var(--ink); color: #a9a396; padding-block: 52px 24px; }
  footer.site h4 {
    color: var(--amber); font-family: "Space Mono", monospace; font-size: 11.5px;
    letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; margin-bottom: 14px;
  }
  footer.site a { color: #a9a396; }
  footer.site a:hover { color: var(--paper); }
  .footgrid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.2fr; gap: 40px; padding-bottom: 32px; border-bottom: 1px solid #2f2a22; }
  .footlist { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
  .footbottom { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; padding-top: 20px; font-family: "Space Mono", monospace; font-size: 11.5px; }

  .section { padding-block: clamp(44px, 6.5vw, 78px); }
  .grid { display: grid; gap: 20px; }
  .g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

  /* Cabeçalho de secção com índice, como um separador de dossiê. */
  .sechead { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap; margin-bottom: 34px; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
  .sechead .idx { font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700; color: var(--red); letter-spacing: 0.1em; }

  .stat { font-family: Archivo, sans-serif; font-weight: 900; font-size: 42px; color: var(--ink); line-height: 1; letter-spacing: -0.04em; }

  .prodstage { padding: 20px 14px 12px; position: relative; border-bottom: 1px solid var(--line); }
  .prodtag {
    position: absolute; left: 12px; top: 12px; font-family: "Space Mono", monospace;
    font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    background: var(--ink); color: var(--paper); padding: 4px 9px;
  }
  .prodcard { display: block; text-align: left; width: 100%; padding: 0; overflow: hidden; }
  .prodcard:hover { border-color: var(--ink); }
  .prodcard h3 { font-size: 20px; }

  .field {
    width: 100%; border: 1.5px solid var(--line); border-radius: 2px;
    padding: 13px 15px; font-size: 15px; background: var(--card); color: var(--ink);
    font-family: inherit;
  }
  .field::placeholder { color: #a8a296; }
  .field:focus { outline: 2px solid var(--red); outline-offset: 1px; border-color: var(--ink); }
  .field.bad { border-color: var(--red); background: #fdf1f0; }
  .err { color: var(--red-dark); font-size: 13px; margin-top: 6px; font-weight: 600; }

  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 10px 16px; border-radius: 2px;
    font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em;
    background: var(--card); border: 1.5px solid var(--line); color: var(--body);
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip.blue.on { background: var(--blue); border-color: var(--blue); }

  /* Amostras de cor com ar de pastilha Pantone. */
  .swatch { width: 46px; height: 54px; border-radius: 2px; padding: 0; box-shadow: inset 0 0 0 1px rgba(20,18,15,.2); }
  .swatch.on { box-shadow: inset 0 0 0 1px rgba(20,18,15,.2), 0 0 0 2px var(--paper), 0 0 0 4px var(--red); }

  .techbtn { display: block; text-align: left; width: 100%; padding: 16px 18px; border-radius: 2px; background: var(--card); border: 1.5px solid var(--line); }
  .techbtn:hover { border-color: var(--ink); }
  .techbtn.on { background: var(--blue); border-color: var(--blue); }
  .techbtn.on .t-name, .techbtn.on .t-note { color: #fff; }
  .techbtn.on .t-note { opacity: .8; }
  .t-name { font-size: 17px; font-weight: 800; color: var(--ink); display: block; letter-spacing: -0.02em; }
  .t-note { font-size: 13.5px; color: var(--muted); display: block; margin-top: 4px; line-height: 1.45; }

  .tier { display: block; text-align: center; padding: 11px 4px; border-radius: 2px; background: var(--card); border: 1.5px solid var(--line); }
  .tier:hover { border-color: var(--ink); }
  .tier.on { background: var(--red); border-color: var(--red); }
  .tier.on .q, .tier.on .u { color: #fff; }
  .tier .q { display: block; font-family: "Space Mono", monospace; font-size: 19px; font-weight: 700; color: var(--ink); }
  .tier .u { display: block; font-family: "Space Mono", monospace; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%) translateY(calc(100% + 40px));
    opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--paper); border-radius: 3px;
    padding: 14px 24px; font-size: 14.5px; font-weight: 700; z-index: 90;
    box-shadow: 0 18px 40px -14px rgba(20,18,15,.6);
    transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 1080px) { nav.main { gap: 16px; } nav.main a { font-size: 12.5px; } }
  @media (max-width: 980px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .footgrid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 900px) {
    nav.main { display: none; }
    .burger { display: inline-flex; }
    .navactions .btn { display: none; }
    .g3, .g2 { grid-template-columns: 1fr; }
    .split { grid-template-columns: 1fr !important; }
    .sticky { position: static !important; }
  }
  @media (max-width: 560px) {
    .g4 { grid-template-columns: 1fr; }
    .footgrid { grid-template-columns: 1fr; gap: 26px; }
    .topbar { font-size: 11px; gap: 8px; }
    .topbar .sep { display: none; }
    .sechead { margin-bottom: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    html { scroll-behavior: auto; }
  }

  .drawer {
    position: fixed; inset: 0; z-index: 60; background: var(--paper);
    display: flex; flex-direction: column; padding: 20px var(--gutter) 40px; overflow-y: auto;
  }
  /* `display:flex` ganha ao [hidden] por omissão, e a gaveta ficava a tapar a
     página inteira a intercetar cliques. Esta regra fecha-a de facto. */
  .drawer[hidden] { display: none; }
  .drawer nav { display: flex; flex-direction: column; gap: 0; margin-top: 26px; }
  .drawer nav a {
    font-size: 30px; font-weight: 800; letter-spacing: -0.035em; color: var(--ink);
    padding-block: 14px; border-bottom: 1px solid var(--line);
  }
</style>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ---------- utilitários ---------- */

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function eur(n) { return n.toFixed(2).replace(".", ",") + " €"; }
function el(id) { return document.getElementById(id); }

/* Luminância relativa, para escolher contorno claro ou escuro sobre a peça. */
function isLight(hex) {
  const h = hex.replace("#", "");
  const v = [0,2,4].map(function (i) {
    const c = parseInt(h.slice(i, i+2), 16) / 255;
    return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  });
  return 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2] > 0.42;
}

let markSeq = 0;
function logo(size, tone) {
  markSeq++;
  const disc = tone === "dark" ? "#fbf7ef" : "#221a14";
  const letter = tone === "dark" ? "#221a14" : "#fbf7ef";
  const sw = size >= 40 ? 11 : 13;
  const seg = 100 / WHEEL.length;
  const arcs = WHEEL.map(function (c, i) {
    return '<circle cx="60" cy="60" r="52" pathLength="100" stroke="' + c +
           '" stroke-dasharray="' + seg.toFixed(4) + ' ' + (100-seg).toFixed(4) +
           '" stroke-dashoffset="' + (-i*seg).toFixed(4) + '"/>';
  }).join("");
  return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" aria-hidden="true">' +
    '<g fill="none" stroke-width="' + sw + '" stroke-linecap="butt" transform="rotate(-90 60 60)">' + arcs + '</g>' +
    '<circle cx="60" cy="60" r="35" fill="' + disc + '"/>' +
    '<text x="60" y="61" text-anchor="middle" dominant-baseline="central" font-family="Archivo, Helvetica, sans-serif" font-weight="800" font-size="46" fill="' + letter + '">C</text>' +
    '</svg>';
}

/* Mira de registo entre duas barras de controlo — o que se vê na margem de
   qualquer folha que sai da máquina. */
const ORNAMENT =
  '<div style="display:flex;align-items:center;gap:16px;width:100%;max-width:620px;">' +
  '<span style="flex:1;height:6px;background:linear-gradient(90deg,' + WHEEL.slice(0,6).join(',') + ');"></span>' +
  '<svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">' +
  '<circle cx="13" cy="13" r="7.5" stroke="#14120f" stroke-width="1.3"/>' +
  '<path d="M13 0v8M13 18v8M0 13h8M18 13h8" stroke="#14120f" stroke-width="1.3"/>' +
  '<circle cx="13" cy="13" r="2.2" fill="#ed1c24"/></svg>' +
  '<span style="flex:1;height:6px;background:linear-gradient(90deg,' + WHEEL.slice(6).join(',') + ');"></span>' +
  '</div>';

/* Barra de controlo de cor, com as doze tintas da marca. */
function colorBar(thin) {
  return '<div class="colorbar' + (thin ? ' thin' : '') + '" aria-hidden="true">' +
    WHEEL.map(function (c) { return '<span style="background:' + c + '"></span>'; }).join("") + '</div>';
}

/* Desenho do produto: a peça pintada com a cor escolhida, a zona de
   impressão tracejada por cima, e a marca do cliente dentro dela. */
let previewSeq = 0;
function productArt(prod, colorKey, areaIdx, artwork, height, showArea) {
  previewSeq++;
  const col = PALETTE[colorKey] || PALETTE.branco;
  const light = isLight(col.hex);
  const line = light ? "rgba(34,26,20,.3)" : "rgba(255,253,249,.38)";
  const areas = AREAS_BY_SHAPE[prod.shape] || [["Frente", 78, 80, 44, 40]];
  const a = areas[Math.min(areaIdx || 0, areas.length - 1)];
  const cid = "clip" + previewSeq;

  const base = '<path d="' + SHAPES[prod.shape] + '" fill="' + col.hex + '" stroke="' + line +
               '" stroke-width="2" stroke-linejoin="round"/>';

  let overlay = "";
  if (artwork) {
    overlay = '<defs><clipPath id="' + cid + '"><rect x="' + a[1] + '" y="' + a[2] + '" width="' + a[3] + '" height="' + a[4] + '"/></clipPath></defs>' +
      '<image href="' + artwork + '" x="' + a[1] + '" y="' + a[2] + '" width="' + a[3] + '" height="' + a[4] +
      '" preserveAspectRatio="xMidYMid meet" clip-path="url(#' + cid + ')"/>';
  } else {
    const s = Math.min(a[3], a[4]) / 62;
    const seg = 100 / WHEEL.length;
    const arcs = WHEEL.map(function (c, i) {
      return '<circle cx="30" cy="30" r="26" pathLength="100" stroke="' + c +
             '" stroke-dasharray="' + seg.toFixed(3) + ' ' + (100-seg).toFixed(3) +
             '" stroke-dashoffset="' + (-i*seg).toFixed(3) + '"/>';
    }).join("");
    const ink = light ? "#221a14" : "#fffdf9";
    overlay = '<g transform="translate(' + (a[1] + a[3]/2 - 30*s).toFixed(2) + ' ' + (a[2] + a[4]/2 - 30*s).toFixed(2) +
      ') scale(' + s.toFixed(3) + ')"><g fill="none" stroke-width="5.5" transform="rotate(-90 30 30)">' + arcs + '</g>' +
      '<circle cx="30" cy="30" r="17.5" fill="' + ink + '"/>' +
      '<text x="30" y="31" text-anchor="middle" dominant-baseline="central" font-family="Archivo, Helvetica, sans-serif" font-weight="800" font-size="23" fill="' + col.hex + '">C</text></g>';
  }

  const areaBox = showArea
    ? '<rect x="' + a[1] + '" y="' + a[2] + '" width="' + a[3] + '" height="' + a[4] +
      '" fill="none" stroke="' + line + '" stroke-width="1.1" stroke-dasharray="3.5 3.5"/>'
    : "";

  return '<svg viewBox="0 0 200 200" width="100%" height="' + height +
    '" role="img" aria-label="' + esc(prod.name) + '" style="display:block;">' +
    base + areaBox + overlay + "</svg>";
}

/* ---------- estado do pedido ---------- */

const STORE_KEY = "correiacor.pedido.v1";
let cart = [];
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) cart = JSON.parse(raw) || [];
} catch (e) { cart = []; }

function saveCart() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(cart)); } catch (e) { /* sessão privada */ }
}
function cartCount() {
  return cart.reduce(function (n, l) { return n + 1; }, 0);
}
function cartTotal() {
  return cart.reduce(function (t, l) { return t + l.unit * l.qty; }, 0);
}
function cartUnits() {
  return cart.reduce(function (t, l) { return t + l.qty; }, 0);
}

let toastTimer = null;
function toast(msg) {
  const t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
}
</script>

let secIdx = 0;
function sectionHead(kick, title, lede) {
  secIdx++;
  const n = String(secIdx).padStart(2, "0");
  return '<div class="sechead">' +
      '<div style="max-width:720px;">' +
        '<span class="idx">' + n + " &mdash; " + esc(kick).toUpperCase() + "</span>" +
        '<h2 style="font-size:clamp(30px,4.4vw,50px);margin-top:12px;">' + title + "</h2>" +
      "</div>" +
      (lede ? '<p style="max-width:420px;font-size:16px;line-height:1.7;">' + lede + "</p>" : "") +
    "</div>";
}

/* Folha de prova: o produto sobre papel branco, com miras de registo nos
   cantos e a barra de controlo de cor no pé, como sai da máquina. */
function regMark(pos) {
  return '<svg width="18" height="18" viewBox="0 0 26 26" fill="none" aria-hidden="true" style="position:absolute;' + pos + ';opacity:.75;">' +
    '<circle cx="13" cy="13" r="7" stroke="#8a8478" stroke-width="1.1"/>' +
    '<path d="M13 1v8M13 17v8M1 13h8M17 13h8" stroke="#8a8478" stroke-width="1.1"/></svg>';
}

function pressSheet() {
  return '<div style="background:var(--blue);padding:clamp(20px,3vw,34px);display:flex;align-items:center;justify-content:center;min-height:400px;">' +
    '<div style="position:relative;background:#fff;width:100%;max-width:430px;padding:34px 26px 0;">' +

function productCard(p) {

}

      '<div style="font-size:14.5px;line-height:1.65;margin-top:3px;">' + esc(n[2]) + "</div></div></div>";
  }).join("");

  return '<div class="halftone wrap" style="padding-block:clamp(44px,6vw,72px);text-align:center;">' +
      '<span class="cap" style="color:var(--red);">Portfolio</span>' +
      '<h1 style="font-size:clamp(40px,7vw,84px);margin-top:18px;">O que já <em style="color:var(--red);">saiu daqui</em></h1>' +
      '<p style="margin:20px auto 0;font-size:18px;line-height:1.75;max-width:620px;">Trabalhos organizados pelas famílias de produtos que a CorreiaCOR produz.</p>' +
    "</div>" +
    '<div class="wrap" style="padding-bottom:30px;"><div class="note" style="max-width:980px;margin-inline:auto;">' +
      "<strong>Esta página está montada mas ainda vazia.</strong> Não há trabalhos publicados no site atual, e não vale a pena inventar clientes. Abaixo fica o que é preciso para encher cada moldura." +
    "</div></div>" +
    '<div class="wrap" style="padding-bottom:clamp(40px,6vw,72px);"><div class="grid g4">' + slots + "</div></div>" +
    '<div class="section" style="background:var(--paper-2);"><div class="wrap">' +
      '<div class="grid split" style="grid-template-columns:.9fr 1.1fr;gap:clamp(28px,4vw,48px);align-items:center;">' +
        '<div><span class="cap" style="color:var(--red);">Como montamos um caso</span>' +
        '<h2 style="font-size:clamp(28px,4vw,46px);margin-top:14px;">Quatro coisas por trabalho</h2></div>' +
        '<div style="display:flex;flex-direction:column;gap:14px;">' + needs + "</div>" +
      "</div>" +
    "</div></div>" +
    ctaBlock();
}
</script>

<script>
"use strict";

/* ---------- catálogo ---------- */

const filters = { cat: "todos", q: "", tech: "" };

function matchingProducts() {
  const q = filters.q.trim().toLowerCase();
  return PRODUCTS.filter(function (p) {
    if (filters.cat !== "todos" && p.cat !== filters.cat) return false;
    if (filters.tech && p.techs.indexOf(filters.tech) === -1) return false;
    if (!q) return true;
    const hay = (p.name + " " + p.blurb + " " + p.detail + " " +
      p.techs.map(function (t) { return TECHNIQUES[t].name; }).join(" ")).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}

function renderGrid() {
  const list = matchingProducts();
  const grid = el("grid");
  const count = el("gridcount");
  if (!grid) return;
  if (!list.length) {
    grid.className = "";
    grid.innerHTML = '<div class="card" style="padding:40px;text-align:center;">' +
      '<h3 style="font-size:26px;">Nada encontrado</h3>' +
      '<p style="margin-top:10px;">Experimente outra palavra, ou limpe os filtros para ver tudo.</p>' +
      '<button class="btn btn-ghost" data-act="clear-filters" style="margin-top:20px;">Limpar filtros</button></div>';
  } else {
    grid.className = "grid g3";
    grid.innerHTML = list.map(productCard).join("");
  }
  if (count) {
    count.innerHTML = '<strong style="font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-0.03em;font-size:22px;color:var(--ink);">' +
      list.length + "</strong> " + (list.length === 1 ? "produto" : "produtos");
  }
  document.querySelectorAll("[data-cat]").forEach(function (b) {
    b.classList.toggle("on", b.dataset.cat === filters.cat);
  });
  document.querySelectorAll("[data-tech]").forEach(function (b) {
    b.classList.toggle("on", b.dataset.tech === filters.tech);
  });
}

function pageBrindes() {
  const cats = CATEGORIES.map(function (c) {
    return '<button class="chip" data-cat="' + c.slug + '">' + esc(c.name) + "</button>";
  }).join("");
  const techs = Object.keys(TECHNIQUES).map(function (k) {
    return '<button class="chip blue" data-tech="' + k + '" style="min-height:40px;padding:8px 14px;font-size:13.5px;">' +
      esc(TECHNIQUES[k].name) + "</button>";
  }).join("");

  return '<div class="halftone wrap" style="padding-block:clamp(40px,5vw,62px);text-align:center;">' +
      '<span class="cap" style="color:var(--red);">Brindes publicitários e têxtil</span>' +
      '<h1 style="font-size:clamp(38px,6vw,78px);margin-top:18px;">Itens personalizáveis para<br><em style="color:var(--red);">ações promocionais</em></h1>' +
      '<p style="margin:20px auto 0;font-size:18px;line-height:1.75;max-width:660px;">Escolha o produto, a cor, a quantidade e a técnica, carregue o logótipo e junte ao pedido. Sem pagamento no site: a CorreiaCOR responde com o orçamento.</p>' +
      '<div style="display:flex;justify-content:center;margin-top:26px;">' +
        '<input id="search" class="field" type="search" placeholder="Procurar por produto, material ou técnica…" aria-label="Procurar no catálogo" style="max-width:520px;border-radius:999px;padding:15px 22px;">' +
      "</div>" +
    "</div>" +
    '<div class="wrap" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-bottom:28px;">' + cats + "</div>" +
    '<div class="wrap" style="padding-bottom:26px;"><div class="note" style="max-width:1000px;margin-inline:auto;">' +
      "<strong>Catálogo de demonstração.</strong> Estes treze produtos e os preços servem para mostrar como a encomenda funciona. O catálogo verdadeiro monta-se com a lista de referências do fornecedor e a tabela de preços da CorreiaCOR." +
    "</div></div>" +
    '<div class="wrap" style="padding-bottom:clamp(40px,6vw,72px);">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px;">' +
        '<span id="gridcount" style="font-size:15px;"></span>' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
          '<span class="cap">Técnica</span>' + techs +
        "</div>" +
      "</div>" +
      '<div id="grid" class="grid g3"></div>' +
    "</div>" +
    ctaBlock();
}

/* ---------- produto e configurador ---------- */

let cfg = null;

function setupCfg(p) {
  cfg = { slug: p.slug, color: p.colors[0], tech: p.techs[0], area: 0, tier: 2, art: null, artName: "" };
}

function cfgUnit(p) {
  return p.tiers[cfg.tier].unit * TECHNIQUES[cfg.tech].mult;
}

function renderCfg() {
  const p = bySlug[cfg.slug];
  const col = PALETTE[cfg.color];
  const areas = AREAS_BY_SHAPE[p.shape] || [["Frente", 78, 80, 44, 40]];
  const stageDark = !isLight(col.stage);

  const stage = el("stage");
  if (stage) {
    stage.style.background = col.stage;
    stage.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
        '<span class="cap" style="color:' + (stageDark ? "rgba(251,247,239,.66)" : "var(--muted)") + ';">Pré-visualização</span>' +
        '<span style="font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 14px;background:' +
          (stageDark ? "rgba(251,247,239,.16)" : "rgba(34,26,20,.08)") + ";color:" +
          (stageDark ? "#fbf7ef" : "var(--ink)") + ';">' + esc(col.n) + "</span>" +
      "</div>" +
      productArt(p, cfg.color, cfg.area, cfg.art, 380, true) +
      '<div style="text-align:center;font-size:12.5px;color:' + (stageDark ? "rgba(251,247,239,.6)" : "var(--muted)") + ';">' +
        (cfg.art ? "A sua marca, aplicada na zona escolhida." : "Simulação. Carregue o seu logótipo para o ver aplicado.") +
      "</div>";
  }

  const cn = el("colorname"); if (cn) cn.textContent = col.n;
  document.querySelectorAll("[data-color]").forEach(function (b) {
    b.classList.toggle("on", b.dataset.color === cfg.color);
  });
  document.querySelectorAll("[data-techsel]").forEach(function (b) {
    b.classList.toggle("on", b.dataset.techsel === cfg.tech);
  });
  document.querySelectorAll("[data-area]").forEach(function (b) {
    b.classList.toggle("on", +b.dataset.area === cfg.area);
  });
  document.querySelectorAll("[data-tier]").forEach(function (b) {
    const i = +b.dataset.tier;
    b.classList.toggle("on", i === cfg.tier);
    const u = b.querySelector(".u");
    if (u) u.textContent = eur(p.tiers[i].unit * TECHNIQUES[cfg.tech].mult);
  });

  const unit = cfgUnit(p);
  const qty = p.tiers[cfg.tier].qty;
  const sum = el("cfgsum");
  if (sum) {
    sum.innerHTML =
      '<div class="ticket-head"><span>Estimativa</span><span>' + qty + ' un. &middot; ' +
        esc(TECHNIQUES[cfg.tech].name) + "</span></div>" +
      '<div style="padding:20px 18px;">' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);">' +
          '<div><div class="cap">Total</div>' +
          '<div class="stat" style="font-size:clamp(34px,5vw,46px);margin-top:6px;">' + eur(unit * qty) + "</div></div>" +
          '<div style="text-align:right;"><div class="cap">Por unidade</div>' +
          '<div class="mono" style="font-size:22px;font-weight:700;color:var(--ink);margin-top:6px;">' + eur(unit) + "</div></div>" +
        "</div>" +
        '<dl style="margin:0;">' +
          '<div class="ticket-row" style="padding-inline:0;"><dt>Zona</dt><dd>' + esc(areas[cfg.area][0]) + "</dd></div>" +
          '<div class="ticket-row" style="padding-inline:0;"><dt>Ficheiro</dt><dd style="color:' +
            (cfg.art ? "var(--green)" : "var(--muted)") + ';">' +
            (cfg.art ? esc(cfg.artName) : "por enviar") + "</dd></div>" +
        "</dl>" +
        '<div class="note" style="margin-top:14px;">Valor de exemplo, sem IVA e sem portes. Quem fecha o preço é a CorreiaCOR, depois de ver o ficheiro e a quantidade.</div>' +
      "</div>";
  }
}

function pageProduto(slug) {
  const p = bySlug[slug];
  if (!p) return pageNotFound();
  if (!cfg || cfg.slug !== slug) setupCfg(p);

  const areas = AREAS_BY_SHAPE[p.shape] || [["Frente", 78, 80, 44, 40]];
  const swatches = p.colors.map(function (k) {
    return '<button class="swatch" data-color="' + k + '" title="' + esc(PALETTE[k].n) + '" aria-label="Cor ' + esc(PALETTE[k].n) + '" style="background:' + PALETTE[k].hex + ';"></button>';
  }).join("");
  const techs = p.techs.map(function (k) {
    return '<button class="techbtn" data-techsel="' + k + '">' +
      '<span class="t-name">' + esc(TECHNIQUES[k].name) + "</span>" +
      '<span class="t-note">' + esc(TECHNIQUES[k].note) + "</span></button>";
  }).join("");
  const areaChips = areas.map(function (a, i) {
    return '<button class="chip" data-area="' + i + '">' + esc(a[0]) + "</button>";
  }).join("");
  const tierBtns = p.tiers.map(function (t, i) {
    return '<button class="tier" data-tier="' + i + '"><span class="q">' + t.qty + '</span><span class="u"></span></button>';
  }).join("");
  const ref = "CC-" + p.slug.slice(0, 3).toUpperCase() + "-" + String(PRODUCTS.indexOf(p) + 1).padStart(3, "0");
  const specs = '<div class="ticket">' +
    '<div class="ticket-head"><span>Ficha técnica</span><span>Ref. ' + ref + "</span></div>" +
    "<dl style=\"margin:0;\">" +
    p.specs.map(function (s) {
      return '<div class="ticket-row"><dt>' + esc(s[0]) + "</dt><dd>" + esc(s[1]) + "</dd></div>";
    }).join("") +
    '<div class="ticket-row"><dt>Técnicas</dt><dd>' +
      p.techs.map(function (k) { return esc(TECHNIQUES[k].name); }).join(" &middot; ") + "</dd></div>" +
    "</dl></div>";

  return '<div class="wrap" style="padding-top:20px;font-size:13.5px;color:var(--muted);">' +
      '<a href="#/brindes" style="color:var(--muted);">Brindes</a> <span style="color:#d3c6b0;">/</span> <span style="color:var(--ink);">' + esc(p.name) + "</span>" +
    "</div>" +
    '<div class="wrap" style="padding-top:16px;"><div class="note"><strong>Página de demonstração.</strong> O produto, as técnicas e os preços são exemplos. Experimente: mude a cor, a técnica, a zona, a quantidade, e carregue um logótipo.</div></div>' +
    '<div class="wrap" style="padding-block:24px clamp(40px,6vw,72px);">' +
      '<div class="grid split" style="grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,48px);align-items:start;">' +
        '<div class="sticky" style="position:sticky;top:100px;">' +
          '<div id="stage" style="border-radius:24px;padding:24px;"></div>' +
          '<div style="display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;">' +
            '<label class="btn" style="flex:1;min-width:200px;border:1.5px dashed #c9bda8;background:var(--card);color:var(--ink);cursor:pointer;">' +
              '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 9 5-5 5 5"/><path d="M12 4v12"/></svg>' +
              '<span id="uplabel">Carregar o meu logótipo</span>' +
              '<input id="upload" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="position:absolute;width:1px;height:1px;opacity:0;">' +
            "</label>" +
            '<button class="btn btn-ghost" data-act="clear-art" style="flex:0 0 auto;">Limpar</button>' +
          "</div>" +
        "</div>" +
        "<div>" +
          "<h1 style=\"font-size:clamp(34px,5vw,58px);\">" + esc(p.name) + "</h1>" +
          '<p style="margin-top:16px;font-size:17px;line-height:1.8;">' + esc(p.detail) + "</p>" +
          '<div style="margin-top:32px;"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;">' +
            '<span class="cap">Um &middot; cor da peça</span><span id="colorname" style="font-size:14.5px;font-weight:600;color:var(--ink);"></span></div>' +
            '<div style="display:flex;gap:12px;flex-wrap:wrap;">' + swatches + "</div></div>" +
          '<div style="margin-top:30px;"><div class="cap" style="margin-bottom:12px;">Dois &middot; técnica de personalização</div>' +
            '<div class="grid g2" style="gap:12px;">' + techs + "</div></div>" +
          '<div style="margin-top:30px;"><div class="cap" style="margin-bottom:12px;">Três &middot; zona de impressão</div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' + areaChips + "</div></div>" +
          '<div style="margin-top:30px;"><div class="cap" style="margin-bottom:12px;">Quatro &middot; quantidade</div>' +
            '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;">' + tierBtns + "</div></div>" +
          '<div class="ticket" id="cfgsum" style="margin-top:30px;"></div>' +
          '<div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;">' +
            '<button class="btn btn-primary" data-act="add" style="flex:1.4;min-width:200px;">Juntar ao pedido</button>' +
            '<a class="btn btn-ghost" href="#/brindes" style="flex:1;min-width:150px;">Continuar a ver</a>' +
          "</div>" +
          '<div style="margin-top:20px;">' + specs + "</div>" +
        "</div>" +
      "</div>" +
    "</div>";
}

function pageNotFound() {
  return '<div class="wrap section" style="text-align:center;">' +
    '<h1 style="font-size:clamp(36px,6vw,64px);">Página não encontrada</h1>' +
    '<p style="margin-top:16px;">O endereço que seguiu não existe neste site.</p>' +
    '<a class="btn btn-primary" href="#/" style="margin-top:24px;">Voltar ao início</a></div>';
}
</script>

<script>
"use strict";

/* ---------- pedido ---------- */

function lineRow(l, i) {
  const p = bySlug[l.slug];
  const col = PALETTE[l.color];
  return '<div class="card" style="padding:20px;display:grid;grid-template-columns:104px 1fr auto;gap:20px;align-items:center;">' +
    '<div style="height:104px;border-radius:90px 90px 10px 10px;display:flex;align-items:center;justify-content:center;background:' + col.stage + ';">' +
      '<div style="width:78px;">' + productArt(p, l.color, l.area, l.art, 78, false) + "</div>" +
    "</div>" +
    "<div><h3 style=\"font-size:23px;\">" + esc(p.name) + "</h3>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
        ["<span>" + esc(col.n) + "</span>", "<span>" + esc(TECHNIQUES[l.tech].name) + "</span>", "<span>" + esc(l.areaName) + "</span>"]
          .map(function (s) { return s.replace("<span>", '<span style="font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--paper-2);color:var(--body);">'); }).join("") +
      "</div>" +
      '<div style="display:flex;align-items:center;gap:8px;margin-top:11px;font-size:13.5px;font-weight:600;color:' + (l.art ? "var(--green)" : "var(--muted)") + ';">' +
        (l.art ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' + esc(l.artName) : "Sem ficheiro — pode enviá-lo depois") +
      "</div>" +
      '<button data-rm="' + i + '" style="margin-top:12px;font-size:13.5px;color:var(--muted);text-decoration:underline;">Remover</button>' +
    "</div>" +
    '<div style="text-align:right;">' +
      '<div style="display:inline-flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;">' +
        '<button data-dec="' + i + '" aria-label="Menos" style="width:32px;height:32px;font-size:18px;color:var(--muted);">&minus;</button>' +
        '<span style="font-size:16px;font-weight:600;color:var(--ink);min-width:44px;">' + l.qty + "</span>" +
        '<button data-inc="' + i + '" aria-label="Mais" style="width:32px;height:32px;font-size:18px;color:var(--muted);">+</button>' +
      "</div>" +
      '<div style="font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-0.03em;font-size:28px;color:var(--ink);margin-top:10px;">' + eur(l.unit * l.qty) + "</div>" +
      '<div style="font-size:12.5px;color:var(--muted);margin-top:2px;">' + eur(l.unit) + " / un.</div>" +
    "</div></div>";
}

function pagePedido() {
  if (!cart.length) {
    return '<div class="wrap section" style="text-align:center;">' +
      '<h1 style="font-size:clamp(36px,6vw,64px);">O seu pedido está vazio</h1>' +
      '<p style="margin:18px auto 0;max-width:520px;font-size:17px;line-height:1.75;">Escolha um brinde no catálogo, configure-o à sua medida e junte-o ao pedido. Nada é cobrado aqui.</p>' +
      '<div style="display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap;">' +
        '<a class="btn btn-primary" href="#/brindes">Ver o catálogo</a>' +
        '<a class="btn btn-ghost" href="#/contacto">Pedir outra coisa</a>' +
      "</div></div>";
  }

  const rows = cart.map(lineRow).join("");
  return '<div class="halftone wrap" style="padding-block:clamp(36px,5vw,56px);text-align:center;">' +
      '<h1 style="font-size:clamp(34px,5.5vw,66px);">O seu pedido <em style="color:var(--red);">de orçamento</em></h1>' +
      '<p style="margin:18px auto 0;font-size:17.5px;line-height:1.75;max-width:620px;">Nada é cobrado aqui. O pedido chega à CorreiaCOR com tudo o que escolheu, e a resposta com o orçamento vem por email ou telefone.</p>' +
    "</div>" +
    '<div class="wrap" style="padding-bottom:clamp(40px,6vw,72px);">' +
      '<div class="grid split" style="grid-template-columns:1fr 400px;gap:28px;align-items:start;">' +
        '<div style="display:flex;flex-direction:column;gap:16px;">' + rows +
          '<div class="note">Os valores são de exemplo. O pedido pode seguir mesmo assim: o que a CorreiaCOR precisa é dos produtos, das quantidades e dos ficheiros.</div>' +
          formBlock("pedido") +
        "</div>" +
        '<div class="sticky" style="position:sticky;top:100px;background:var(--blue);color:var(--paper-2);border-radius:24px;padding:30px;">' +
          '<div class="cap" style="color:var(--amber);margin-bottom:18px;">Resumo</div>' +
          '<div style="display:flex;flex-direction:column;gap:12px;font-size:15px;padding-bottom:18px;border-bottom:1px solid rgba(217,164,65,.35);">' +
            '<div style="display:flex;justify-content:space-between;gap:12px;"><span style="color:rgba(243,235,221,.82);">' +

            '<div style="display:flex;justify-content:space-between;gap:12px;"><span style="color:rgba(243,235,221,.82);">Personalização</span><span style="color:#fbf7ef;font-weight:600;">incluída</span></div>' +
            '<div style="display:flex;justify-content:space-between;gap:12px;"><span style="color:rgba(243,235,221,.82);">Portes</span><span style="color:rgba(243,235,221,.7);">a confirmar</span></div>' +
          "</div>" +
          '<div style="padding:20px 0;"><div style="font-size:13px;color:rgba(243,235,221,.7);">Valor de exemplo, sem IVA</div>' +
            '<div style="font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-0.03em;font-size:clamp(34px,5vw,46px);color:#fbf7ef;margin-top:4px;line-height:1;">' + eur(cartTotal()) + "</div></div>" +
          '<div style="background:rgba(251,247,239,.09);border-radius:14px;padding:14px 18px;font-size:13.5px;line-height:1.65;color:rgba(243,235,221,.85);">Isto não é uma fatura nem um orçamento. Quem fecha o preço é a CorreiaCOR, depois de ver os ficheiros e as quantidades.</div>' +
          '<button class="btn btn-ochre" data-act="submit-pedido" style="width:100%;margin-top:20px;">Enviar pedido</button>' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;font-size:13px;color:rgba(243,235,221,.72);">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>' +
            "Sem pagamento nem compromisso</div>" +
        "</div>" +
      "</div>" +
    "</div>";
}

/* ---------- formulário ---------- */

function formBlock(kind) {
  const servicos = ["Orçamento", "Esclarecimento", "Outro"].map(function (s, i) {
    return '<button type="button" class="chip blue' + (i === 0 ? " on" : "") + '" data-serv="' + esc(s) + '">' + esc(s) + "</button>";
  }).join("");
  return '<form class="card" id="form-' + kind + '" style="padding:clamp(24px,3vw,34px);" novalidate>' +
    '<h2 style="font-size:clamp(26px,3.5vw,38px);">' + (kind === "pedido" ? "Os seus dados" : "Peça agora") + "</h2>" +
    '<p style="margin-top:10px;font-size:16px;line-height:1.75;">Preencha os seus dados e entraremos em contacto consigo com a maior brevidade possível.</p>' +
    '<div class="grid g2" style="gap:12px;margin-top:24px;">' +
      '<div><input class="field" name="nome" placeholder="Nome*" autocomplete="name"><div class="err" hidden></div></div>' +
      '<div><input class="field" name="email" type="email" placeholder="E-mail*" autocomplete="email"><div class="err" hidden></div></div>' +
      '<div><input class="field" name="telefone" placeholder="Telefone*" autocomplete="tel"><div class="err" hidden></div></div>' +
      '<div><input class="field" name="empresa" placeholder="Empresa" autocomplete="organization"></div>' +
    "</div>" +
    (kind === "contacto"
      ? '<div style="margin-top:22px;"><div class="cap" style="margin-bottom:10px;">Serviço solicitado</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;" id="servrow">' + servicos + "</div></div>"
      : "") +
    '<div style="margin-top:16px;"><textarea class="field" name="mensagem" rows="4" placeholder="Mensagem — conte-nos o projeto: quantidades, prazo, materiais…"></textarea></div>' +
    '<label style="display:flex;align-items:flex-start;gap:12px;margin-top:18px;font-size:14px;line-height:1.6;cursor:pointer;">' +
      '<input type="checkbox" name="rgpd" style="width:19px;height:19px;margin-top:2px;flex:0 0 19px;">' +
      "<span>Autorizo o tratamento dos meus dados para resposta a este pedido.</span></label>" +
    '<div class="err" data-for="rgpd" hidden></div>' +
    '<button class="btn btn-primary" type="submit" style="width:100%;margin-top:22px;">' +
      (kind === "pedido" ? "Enviar pedido" : "Peça agora") + "</button>" +
  "</form>";
}

function confirmationHtml(data, lines) {
  const resumo = lines && lines.length
    ? '<div style="margin-top:22px;padding-top:20px;border-top:1px solid var(--line-soft);">' +
      '<div class="cap" style="margin-bottom:12px;">O que pediu</div>' +
      lines.map(function (l) {
        const p = bySlug[l.slug];
        return '<div style="display:flex;justify-content:space-between;gap:14px;padding-block:8px;font-size:15px;">' +
          "<span>" + esc(p.name) + " &middot; " + esc(PALETTE[l.color].n) + " &middot; " + esc(TECHNIQUES[l.tech].name) +
          '</span><span style="color:var(--ink);font-weight:600;white-space:nowrap;">' + l.qty + " un.</span></div>";
      }).join("") + "</div>"
    : "";

  return '<div class="wrap section" style="max-width:760px;margin-inline:auto;">' +
    '<div class="card" style="padding:clamp(28px,4vw,44px);text-align:center;">' +
      '<div style="width:72px;height:72px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto;">' +
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fbf7ef" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>' +
      '<h1 style="font-size:clamp(30px,4.5vw,46px);margin-top:24px;">Pedido registado, ' + esc(data.nome.split(" ")[0]) + "</h1>" +
      '<p style="margin-top:16px;font-size:17px;line-height:1.75;">A CorreiaCOR entra em contacto consigo pelo ' + esc(data.email) + " ou pelo " + esc(data.telefone) + ".</p>" +
      '<div style="text-align:left;margin-top:28px;padding:24px;background:var(--paper-2);border-radius:18px;">' +
        '<div class="cap" style="margin-bottom:12px;">Os seus dados</div>' +
        '<div style="font-size:15px;line-height:1.9;">' + esc(data.nome) +
          (data.empresa ? " &middot; " + esc(data.empresa) : "") + "<br>" + esc(data.email) + "<br>" + esc(data.telefone) +
          (data.servico ? "<br>Assunto: " + esc(data.servico) : "") + "</div>" +
        (data.mensagem ? '<p style="margin-top:14px;font-size:15px;line-height:1.7;">' + esc(data.mensagem) + "</p>" : "") +
        resumo +
      "</div>" +
      '<div class="note" style="margin-top:24px;text-align:left;"><strong>Nesta versão de demonstração o pedido não é enviado a lado nenhum</strong> — fica só no seu ecrã. No site publicado, este formulário chega a ' + esc(CO.email) + ". Entretanto, pode ligar ou escrever diretamente.</div>" +
      '<div style="display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap;">' +
        '<a class="btn btn-primary" href="tel:' + CO.phoneHref + '">' + esc(CO.phone) + "</a>" +
        '<a class="btn btn-ghost" href="mailto:' + CO.email + '">' + esc(CO.email) + "</a>" +
        '<a class="btn btn-ghost" href="#/">Voltar ao início</a>' +
      "</div>" +
    "</div></div>";
}

function pageContacto() {
  return '<div class="halftone wrap" style="padding-block:clamp(40px,5vw,64px);text-align:center;">' +
      '<span class="cap" style="color:var(--red);">Contacto</span>' +
      '<h1 style="font-size:clamp(36px,6vw,74px);margin-top:18px;">Consulte os <em style="color:var(--red);">nossos serviços</em></h1>' +
      '<p style="margin:20px auto 0;font-size:18px;line-height:1.75;max-width:600px;">Preencha os seus dados e entraremos em contacto consigo com a maior brevidade possível.</p>' +
    "</div>" +
    '<div class="wrap" style="padding-bottom:clamp(40px,6vw,72px);">' +
      '<div class="grid split" style="grid-template-columns:.82fr 1.18fr;gap:28px;align-items:start;">' +
        '<div style="display:flex;flex-direction:column;gap:16px;">' +
          contactCard("Telefone", CO.phone, CO.phoneNote, "tel:" + CO.phoneHref, true,
            "M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z") +
          contactCard("Email", CO.email, "", "mailto:" + CO.email, false,
            "M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm18 2-10 7L2 6") +
          contactCard("Onde estamos", CO.street, CO.postal, "", false,
            "M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z") +
          '<div class="card" style="padding:26px;">' +
            '<div class="cap" style="color:var(--red);">Horário de atendimento</div>' +
            '<div style="display:flex;flex-direction:column;gap:12px;margin-top:14px;font-size:15.5px;">' +
              '<div style="display:flex;justify-content:space-between;gap:12px;"><span>2.ª a 6.ª feira</span><span style="color:var(--ink);font-weight:600;">9h30 – 18h30</span></div>' +
              '<div style="display:flex;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line-soft);"><span>Sábado e domingo</span><span style="color:var(--muted);">Encerrado</span></div>' +
            "</div></div>" +
        "</div>" +
        formBlock("contacto") +
      "</div>" +
    "</div>";
}

function contactCard(label, value, note, href, solid, icon) {
  const inner =
    '<div style="display:flex;align-items:flex-start;gap:16px;">' +
      '<div style="width:46px;height:46px;flex:0 0 46px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:' +
        (solid ? "rgba(251,247,239,.16)" : "var(--paper-2)") + ';">' +
        '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="' + (solid ? "#d9a441" : "var(--red)") +
        '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="' + icon + '"/></svg></div>' +
      "<div>" +
        '<div class="cap" style="color:' + (solid ? "#d9a441" : "var(--muted)") + ';">' + esc(label) + "</div>" +
        '<div style="font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-0.03em;font-size:clamp(22px,3vw,28px);color:' +
          (solid ? "#fbf7ef" : "var(--ink)") + ';margin-top:6px;line-height:1.2;word-break:break-word;">' + esc(value) + "</div>" +
        (note ? '<div style="font-size:13.5px;color:' + (solid ? "rgba(243,235,221,.7)" : "var(--muted)") + ';margin-top:6px;">' + esc(note) + "</div>" : "") +
      "</div></div>";
  const style = "padding:26px;border-radius:22px;display:block;" +
    (solid ? "background:var(--blue);border:1px solid var(--blue);" : "background:var(--card);border:1px solid var(--line);");
  return href ? '<a href="' + href + '" style="' + style + '">' + inner + "</a>"
              : '<div style="' + style + '">' + inner + "</div>";
}
</script>

<script>
"use strict";

/* ---------- encaminhamento ---------- */

let confirmPayload = null;
let servicoEscolhido = "Orçamento";

function currentRoute() {
  const h = location.hash || "#/";
  return h.split("?")[0];
}

function pageFor(route) {
  if (route === "#/" || route === "#") return pageHome();
  if (route === "#/quem-somos") return pageQuemSomos();
  if (route === "#/servicos") return pageServicos();
  if (route === "#/brindes") return pageBrindes();
  if (route.indexOf("#/brindes/") === 0) return pageProduto(route.slice("#/brindes/".length));
  if (route === "#/pedido") return pagePedido();
  if (route === "#/portfolio") return pagePortfolio();
  if (route === "#/contacto") return pageContacto();
  if (route === "#/obrigado" && confirmPayload) {
    return confirmationHtml(confirmPayload.data, confirmPayload.lines);
  }
  return pageNotFound();
}

let lastRoute = null;
function render() {
  const route = currentRoute();
  markSeq = 0;
  el("app").innerHTML = header(route) + '<main id="main">' + pageFor(route) + "</main>" + footer() + drawer();
  if (lastRoute !== route) window.scrollTo({ top: 0, behavior: "instant" in window ? "auto" : "auto" });
  lastRoute = route;
  afterRender(route);
}

function afterRender(route) {
  if (route === "#/brindes") {
    renderGrid();
    const s = el("search");
    if (s) {
      s.value = filters.q;
      s.addEventListener("input", function () { filters.q = s.value; renderGrid(); });
    }
  }
  if (route.indexOf("#/brindes/") === 0 && cfg) {
    renderCfg();
    const up = el("upload");
    if (up) {
      up.addEventListener("change", function () {
        const f = up.files && up.files[0];
        if (!f) return;
        if (f.size > 4 * 1024 * 1024) { toast("Ficheiro demasiado grande (máx. 4 MB)"); return; }
        const fr = new FileReader();
        fr.onload = function () {
          cfg.art = fr.result;
          cfg.artName = f.name;
          const lbl = el("uplabel");
          if (lbl) lbl.textContent = f.name;
          renderCfg();
          toast("Logótipo aplicado");
        };
        fr.readAsDataURL(f);
      });
    }
  }
  const form = document.querySelector("form[id^='form-']");
  if (form) form.addEventListener("submit", onSubmit);
}

/* ---------- interações ---------- */

function fieldError(input, msg) {
  const box = input.parentElement.querySelector(".err");
  input.classList.toggle("bad", !!msg);
  if (box) { box.textContent = msg || ""; box.hidden = !msg; }
  return !msg;
}

function onSubmit(ev) {
  ev.preventDefault();
  const f = ev.currentTarget;
  const g = function (n) { return f.querySelector('[name="' + n + '"]'); };
  let ok = true;

  ok = fieldError(g("nome"), g("nome").value.trim() ? "" : "Diga-nos como se chama.") && ok;
  const mail = g("email").value.trim();
  ok = fieldError(g("email"), /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail) ? "" : "Confirme o endereço de email.") && ok;
  ok = fieldError(g("telefone"), g("telefone").value.trim() ? "" : "Precisamos de um contacto telefónico.") && ok;

  const rgpd = g("rgpd");
  const rgpdErr = f.querySelector('[data-for="rgpd"]');
  if (!rgpd.checked) {
    ok = false;
    rgpdErr.textContent = "É preciso autorizar o tratamento dos dados para lhe podermos responder.";
    rgpdErr.hidden = false;
  } else { rgpdErr.hidden = true; }

  if (!ok) {
    const bad = f.querySelector(".field.bad") || f.querySelector('[name="rgpd"]');
    if (bad) bad.focus();
    toast("Falta preencher alguma coisa");
    return;
  }

  confirmPayload = {
    data: {
      nome: g("nome").value.trim(),
      email: mail,
      telefone: g("telefone").value.trim(),
      empresa: g("empresa") ? g("empresa").value.trim() : "",
      mensagem: g("mensagem") ? g("mensagem").value.trim() : "",
      servico: f.id === "form-contacto" ? servicoEscolhido : "",
    },
    lines: f.id === "form-pedido" ? cart.slice() : [],
  };
  if (f.id === "form-pedido") { cart = []; saveCart(); }
  location.hash = "#/obrigado";
}

document.addEventListener("click", function (ev) {
  const t = ev.target.closest("[data-act],[data-cat],[data-tech],[data-color],[data-techsel],[data-area],[data-tier],[data-serv],[data-inc],[data-dec],[data-rm]");
  if (!t) return;

  const act = t.dataset.act;
  if (act === "hide-notice") {
    noticeHidden = true;
    try { localStorage.setItem(NOTICE_KEY, "1"); } catch (e) {}
    render();
    return;
  }
  if (act === "menu") { el("drawer").hidden = false; document.body.style.overflow = "hidden"; return; }
  if (act === "close-menu") { el("drawer").hidden = true; document.body.style.overflow = ""; return; }
  if (act === "clear-filters") { filters.cat = "todos"; filters.q = ""; filters.tech = ""; render(); return; }
  if (act === "clear-art" && cfg) {
    cfg.art = null; cfg.artName = "";
    const lbl = el("uplabel"); if (lbl) lbl.textContent = "Carregar o meu logótipo";
    const up = el("upload"); if (up) up.value = "";
    renderCfg();
    return;
  }
  if (act === "add" && cfg) {
    const p = bySlug[cfg.slug];
    const areas = AREAS_BY_SHAPE[p.shape] || [["Frente"]];
    cart.push({
      slug: cfg.slug, color: cfg.color, tech: cfg.tech, area: cfg.area,
      areaName: areas[cfg.area][0], qty: p.tiers[cfg.tier].qty,
      unit: +cfgUnit(p).toFixed(2), art: cfg.art, artName: cfg.artName,
    });
    saveCart();
    toast(p.name + " juntou-se ao pedido");
    render();
    return;
  }
  if (act === "submit-pedido") {
    const f = el("form-pedido");
    if (f) {
      f.scrollIntoView({ behavior: "smooth", block: "start" });
      if (typeof f.requestSubmit === "function") f.requestSubmit();
      else f.dispatchEvent(new Event("submit", { cancelable: true }));
    }
    return;
  }

  if (t.dataset.cat) { filters.cat = t.dataset.cat; renderGrid(); return; }
  if (t.dataset.tech) { filters.tech = filters.tech === t.dataset.tech ? "" : t.dataset.tech; renderGrid(); return; }
  if (t.dataset.color && cfg) { cfg.color = t.dataset.color; renderCfg(); return; }
  if (t.dataset.techsel && cfg) { cfg.tech = t.dataset.techsel; renderCfg(); return; }
  if (t.dataset.area && cfg) { cfg.area = +t.dataset.area; renderCfg(); return; }
  if (t.dataset.tier && cfg) { cfg.tier = +t.dataset.tier; renderCfg(); return; }
  if (t.dataset.serv) {
    servicoEscolhido = t.dataset.serv;
    document.querySelectorAll("[data-serv]").forEach(function (b) {
      b.classList.toggle("on", b.dataset.serv === servicoEscolhido);
    });
    return;
  }

  if (t.dataset.inc !== undefined) { const i = +t.dataset.inc; cart[i].qty += 5; saveCart(); render(); return; }
  if (t.dataset.dec !== undefined) {
    const i = +t.dataset.dec;
    cart[i].qty = Math.max(1, cart[i].qty - 5);
    saveCart(); render(); return;
  }
  if (t.dataset.rm !== undefined) {
    cart.splice(+t.dataset.rm, 1); saveCart(); toast("Removido do pedido"); render(); return;
  }
});

document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") {
    const d = el("drawer");
    if (d && !d.hidden) { d.hidden = true; document.body.style.overflow = ""; }
  }
});

window.addEventListener("hashchange", render);
if (!location.hash) location.hash = "#/";
render();
</script>
